# The parity base document, OpenSLO v1alpha dialect. See `base.slokit.yaml`.
apiVersion: openslo/v1alpha
kind: SLO
metadata:
  name: requests-availability
spec:
  service: parity
  description: "The dialect parity base document."
  budgetingMethod: Occurrences
  objectives:
    - ratioMetrics:
        good:
          source: prometheus
          queryType: promql
          query: sum(rate(http_request_duration_seconds_count{job="parity",code!~"5.."}[{{.window}}]))
        total:
          source: prometheus
          queryType: promql
          query: sum(rate(http_request_duration_seconds_count{job="parity"}[{{.window}}]))
      target: 0.999
  timeWindows:
    - count: 30
      unit: Day
