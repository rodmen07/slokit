# `base.sloth-crd.yaml` plus exactly one construct: a sloth SLO plugin chain,
# in the CRD spelling (`spec.sloPlugins`, `slos[].plugins`).
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: parity
spec:
  service: parity
  sloPlugins:
    chain:
      - id: "sloth.dev/core/debug/v1"
        priority: 9999999
        config: {msg: "spec-level"}
  slos:
    - name: requests-availability
      objective: 99.9
      description: "The dialect parity base document."
      plugins:
        chain:
          - id: "sloth.dev/core/debug/v1"
            priority: 1050
            config: {msg: "slo-level"}
      sli:
        events:
          errorQuery: (sum(rate(http_request_duration_seconds_count{job="parity"}[{{.window}}]))) - (sum(rate(http_request_duration_seconds_count{job="parity",code!~"5.."}[{{.window}}])))
          totalQuery: sum(rate(http_request_duration_seconds_count{job="parity"}[{{.window}}]))
