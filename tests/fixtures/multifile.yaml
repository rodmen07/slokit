# Multi-document spec stream, derived from sloth's `examples/multifile.yml`
# (https://github.com/slok/sloth, fetched from `slok/sloth@main` 2026-08-04).
# Two `prometheus/v1` services in one file, `---`-separated: the real-world
# input shape that v1.3.0 PR 1 (multi-document spec input) exists to read.
# Derivation: trimmed sloth's inline comments; queries, objectives, labels,
# and alerting blocks are carried as published.
---
version: "prometheus/v1"
service: "myservice"
labels:
  owner: "myteam"
  repo: "myorg/myservice"
  tier: "2"
slos:
  - name: "requests-availability"
    objective: 99.9
    description: "Common SLO based on availability for HTTP request responses."
    sli:
      events:
        error_query: sum(rate(http_request_duration_seconds_count{job="myservice",code=~"(5..|429)"}[{{.window}}]))
        total_query: sum(rate(http_request_duration_seconds_count{job="myservice"}[{{.window}}]))
    alerting:
      name: MyServiceHighErrorRate
      labels:
        category: "availability"
      annotations:
        summary: "High error rate on 'myservice' requests responses"
      page_alert:
        labels:
          severity: pageteam
          routing_key: myteam
      ticket_alert:
        labels:
          severity: "slack"
          slack_channel: "#alerts-myteam"

---
