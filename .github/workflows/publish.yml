name: Publish to crates.io

on:
  release:
    types: [published]

# Least-privilege token: publishing needs only checkout (Contents: read);
# the crates.io push authenticates with CRATES_IO_TOKEN, never GITHUB_TOKEN.
# tests/workflow_permissions.rs pins this block and its scope.
permissions:
  contents: read

# Third-party actions are pinned to full-length commit SHAs (the release they
# resolved to is in the trailing comment), enforced by tests/action_pinning.rs
# and kept current by Dependabot. This is the workflow where a mutable tag
# would cost the most: the job has CRATES_IO_TOKEN in scope and its output is
# an irreversible crates.io publish. `dtolnay/rust-toolchain@stable` is the
# one exempt family -- there the ref names the TOOLCHAIN, not a version. The
# full rationale lives in ci.yml beside the same policy.
#
# Every cargo step below that resolves dependencies carries `--locked`, for
# the same reason and with more at stake. `cargo publish` does NOT imply it:
# measured on cargo 1.96.0 against a deliberately stale lockfile, `cargo
# package --no-verify` exited 0, logged `Updating crates.io index`, and
# REWROTE Cargo.lock, while the identical command with `--locked` exited 101
# with "cannot update the lock file ... because --locked was passed". So
# without the flag this job re-resolves against the live index at publish
# time and ships an artifact built, tested and packaged against a dependency
# graph no CI run ever saw -- and because `cargo package --list` includes
# `Cargo.lock`, that unverified graph is exactly what `cargo install --locked
# slokit` hands a user. `cargo fmt` is the one step without the flag: rustfmt
# reads sources and never resolves dependencies.
#
# tests/release_lockfile.rs enforces this across every release-triggered
# workflow, discovered by trigger rather than by filename.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify version matches tag
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "unknown")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION but git tag is $TAG"
            exit 1
          fi

      # Fail in seconds, before the expensive gates and long before anything
      # is uploaded, if the committed lockfile disagrees with Cargo.toml.
      # `--locked` on the steps below would catch it too, but only after
      # clippy and the full suite have already run.
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --locked --all-features

      - name: Test lean core (no default features)
        run: cargo test --locked --no-default-features --lib

      - name: Publish to crates.io
        env:
          # The env var name is fixed by cargo itself; the SECRET it reads from
          # is CRATES_IO_TOKEN, which is the name used across all three crate
          # repos. The old CARGO_REGISTRY_TOKEN secret predates that convention
          # and went stale when the token was rotated on 2026-07-19, which
          # silently failed the v1.0.0 publish.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set +e
          output=$(cargo publish --locked 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Published successfully."
          elif echo "$output" | grep -q "already exists"; then
            echo "::notice::This version is already on crates.io; skipping publish."
          else
            exit "$status"
          fi
