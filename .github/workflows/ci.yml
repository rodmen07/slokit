name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token for every job. The repository default is a settings
# toggle, not a reviewed commit: without this block a change to that toggle
# silently widens every job's GITHUB_TOKEN. Nothing here needs more than
# checkout (Contents: read); the default also handed out Packages: read.
# tests/workflow_permissions.rs pins this block and its scope.
permissions:
  contents: read

# Third-party actions are pinned to full-length commit SHAs, with the release
# they resolved to written in the trailing comment. A tag like `@v7` is a
# MUTABLE ref the upstream owner can repoint at any commit, so a tag pin means
# "run whatever that account publishes next" -- on a repo that holds
# CRATES_IO_TOKEN and publishes to crates.io. The SHA is the only ref GitHub
# will not silently move. Dependabot's `github-actions` ecosystem updates SHA
# pins and rewrites the comment, so currency is not lost by pinning.
#
# ONE family is deliberately NOT SHA-pinned, because for it the ref name is an
# ARGUMENT rather than a version: `dtolnay/rust-toolchain@stable` and
# `@1.82` select the toolchain to install (the action reads its own
# `github.action_ref`), so a SHA there would ask for a toolchain named by a
# hex string. That family is also the one `.github/dependabot.yml` ignores,
# for the same reason. `taiki-e/install-action` used to be in the same shape
# via its per-tool tags (`@cargo-audit`); it is pinned here by moving the tool
# name into `with: tool:`, which is the form its action.yml documents.
#
# tests/action_pinning.rs enforces all of the above: it discovers every
# workflow file, fails on any unpinned `uses:` outside the named exemption,
# and fails on an exemption that no workflow still uses.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The committed Cargo.lock must already agree with Cargo.toml. Every
      # other cargo invocation in this job would silently REPAIR a stale
      # lockfile in the runner's working copy and carry on green, so a
      # release-prep PR that bumps the version and forgets `cargo update`
      # ships a committed lockfile that disagrees with the crate it locks and
      # nothing reports it. `--locked` is the one mode that refuses to repair:
      # it exits 101 with "cannot update the lock file ... because --locked was
      # passed". `metadata` is used rather than a build so this fails in
      # seconds, before the expensive steps.
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      - name: Build lean core (no default features)
        run: cargo build --no-default-features

      - name: Test lean core
        run: cargo test --no-default-features --lib

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit

      - name: Run security audit
        # --deny warnings: without it, `cargo audit` exits 0 on `unsound` and
        # `yanked` advisories, so they accumulate silently while CI stays green.
        # This commit's Cargo.lock fixes RUSTSEC-2026-0185 (quinn-proto, HIGH,
        # remote memory exhaustion, -> 0.11.16) and RUSTSEC-2026-0190 (anyhow,
        # unsound Error::downcast_mut, -> 1.0.104), so the gate starts from a
        # clean baseline; a new advisory now fails the build instead of
        # scrolling past unseen.
        run: cargo audit --deny warnings

  msrv:
    name: MSRV 1.82
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stable cargo first: its rust-version-aware resolver (1.84+) picks
      # dependency versions that honor rust-version = "1.82". Installing 1.82
      # second makes it the default toolchain for the build steps.
      - name: Install stable toolchain (MSRV-aware resolver)
        uses: dtolnay/rust-toolchain@stable

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.82

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-hack

      # The committed Cargo.lock tracks current dependencies, some of which
      # (clap 4.6+, the ICU4X tree) need newer rustc. Resolve an
      # MSRV-compatible graph for this job only: the fallback resolver
      # downgrades where a compatible release exists, and idna_adapter is
      # pinned to 1.1.0, the upstream-supported escape hatch that swaps the
      # ICU4X unicode backend (MSRV 1.83+) for unicode-rs.
      - name: Resolve MSRV-compatible dependencies
        run: |
          cargo +stable update
          cargo +stable update idna_adapter --precise 1.1.0
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      # Build-only, without dev-dependencies: `cargo hack --no-dev-deps`
      # proves the library and CLI compile on 1.82 while keeping test tooling
      # (insta, jsonschema) out of the MSRV contract.
      - name: Build (default features)
        run: cargo hack build --no-dev-deps

      - name: Build (all features)
        run: cargo hack build --no-dev-deps --all-features

      - name: Build lean core (no default features)
        run: cargo hack build --no-dev-deps --no-default-features

  promtool:
    name: promtool check generated rules
    runs-on: ubuntu-latest
    env:
      # Pinned Prometheus release providing promtool (3.5.x is the LTS line).
      PROMETHEUS_VERSION: 3.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install promtool
        run: |
          curl -sSfL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar -xzf prometheus.tar.gz
          echo "${PWD}/prometheus-${PROMETHEUS_VERSION}.linux-amd64" >> "$GITHUB_PATH"

      - name: Verify promtool
        run: promtool --version

      - name: Promtool-validate generated rules
        run: cargo test --test promtool
        env:
          SLOKIT_REQUIRE_PROMTOOL: "1"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # The token is lifted to the job level because the `secrets` context is
    # NOT available in a step-level `if:` (only `env` is), and the upload step
    # below has to be able to ask whether a token exists before it runs.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      # Codecov no longer accepts tokenless uploads and this repo has no
      # CODECOV_TOKEN secret, so this step used to run, log `-> Token length: 0`
      # then `Upload queued for processing failed: {"message":"Token required -
      # not valid tokenless upload"}`, and STILL report success because of
      # `fail_ci_if_error: false` (main run 31270524770, job 93135535624, head
      # 354ad11). A green job advertising a coverage integration that has never
      # published a byte is the inert-surface class these gates exist to catch.
      # So: run only when a token is actually configured, and be loud when it
      # is. tests/coverage_upload.rs pins all three halves of that contract.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: true

      # An absent token has to be VISIBLE. Skipping quietly would leave the run
      # summary indistinguishable from one where coverage really was published,
      # which is the same defect in a different costume.
      - name: Report that the Codecov upload was skipped
        if: env.CODECOV_TOKEN == ''
        run: |
          echo "::notice title=Codecov upload skipped::CODECOV_TOKEN is not configured in this repository, so lcov.info was generated but never published."
          {
            echo "### Coverage generated, not published"
            echo
            echo "\`CODECOV_TOKEN\` is not configured in this repository, so"
            echo "\`lcov.info\` was produced but the Codecov upload was skipped."
            echo "Set the secret to start publishing; the upload fails loudly"
            echo "from then on (\`fail_ci_if_error: true\`)."
          } >> "$GITHUB_STEP_SUMMARY"
